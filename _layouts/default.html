
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/space-theme.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-content">
        <div class="logo">
          <div class="logo-icon">YK</div>
          <h1>{{ site.name }}</h1>
        </div>
        <nav>
          <a href="{{ site.baseurl }}/">Home</a>
          <a href="{{ site.baseurl }}/showcase/">Projects</a>
          <a href="{{ site.baseurl }}/professionaldevelopment/">Skills</a>
          <a href="{{ site.baseurl }}/about.html">About</a>
          <a href="https://github.com/{{ site.github_username }}" target="_blank" class="btn-primary" style="padding: 0.5rem 1rem; background: var(--primary); color: white; border-radius: 8px;">
            <i class="fab fa-github"></i> GitHub
          </a>
        </nav>
      </div>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      <div class="footer-content">
        <div class="social-links">
          <a href="https://github.com/{{ site.github_username }}" target="_blank" class="social-link" title="GitHub">
            <i class="fab fa-github"></i>
          </a>
          <a href="{{ site.linkedin_url }}" target="_blank" class="social-link" title="LinkedIn">
            <i class="fab fa-linkedin-in"></i>
          </a>
          <a href="mailto:{{ site.email }}" class="social-link" title="Email">
            <i class="fas fa-envelope"></i>
          </a>
        </div>
        <div class="footer-text">
          <p>&copy; {{ "now" | date: "%Y" }} {{ site.name }}. Space Systems Engineering Portfolio.</p>
          <p><a href="https://github.com/{{ site.github_username }}/{{ site.repository | split: '/' | last }}" target="_blank">View Source on GitHub</a></p>
        </div>
      </div>
    </footer>
  </div>
  <script src="{{ site.baseurl }}/assets/js/space-theme.js"></script>
</body>
</html>


<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #8b5cf6;
      --accent: #ec4899;
      --dark: #0f172a;
      --dark-lighter: #1e293b;
      --gray: #64748b;
      --gray-light: #cbd5e1;
      --light: #f1f5f9;
      --white: #ffffff;
      --success: #10b981;
      --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --gradient-2: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      color: var(--dark);
      background: var(--light);
      min-height: 100vh;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--white);
      min-height: 100vh;
      box-shadow: 0 0 60px rgba(0,0,0,0.08);
    }
    
    /* Modern Navigation */
    header {
      background: var(--white);
      padding: 1.5rem 3rem;
      border-bottom: 1px solid var(--gray-light);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.95);
    }
    
    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    
    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--gradient-2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 1.2rem;
    }
    
    .logo h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--dark);
    }
    
    nav {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    
    nav a {
      color: var(--gray);
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.3s ease;
      font-size: 0.95rem;
    }
    
    nav a:hover {
      background: var(--light);
      color: var(--primary);
    }
    
    nav a.active {
      background: var(--primary);
      color: white;
    }
    
    /* Main Content */
    main {
      padding: 0;
      background: var(--white);
    }
    
    /* Hero Section */
    .hero {
      background: var(--gradient-2);
      color: white;
      padding: 5rem 3rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
      opacity: 0.3;
    }
    
    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
    }
    
    .hero h1 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 1rem;
      line-height: 1.2;
    }
    
    .hero p {
      font-size: 1.25rem;
      margin-bottom: 2rem;
      opacity: 0.95;
      line-height: 1.8;
    }
    
    .hero-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 2rem;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      font-size: 1rem;
    }
    
    .btn-primary {
      background: white;
      color: var(--primary);
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    .btn-secondary {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 2px solid white;
    }
    
    .btn-secondary:hover {
      background: white;
      color: var(--primary);
    }
    
    /* Content Section */
    .content-section {
      padding: 4rem 3rem;
    }
    
    .section-header {
      text-align: center;
      margin-bottom: 3rem;
    }
    
    .section-header h2 {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 0.5rem;
    }
    
    .section-header p {
      font-size: 1.1rem;
      color: var(--gray);
    }
    
    /* Project Cards Grid */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }
    
    .project-card {
      background: white;
      border: 1px solid var(--gray-light);
      border-radius: 16px;
      padding: 2rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    .project-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gradient-2);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s ease;
    }
    
    .project-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }
    
    .project-card:hover::before {
      transform: scaleX(1);
    }
    
    .project-icon {
      width: 60px;
      height: 60px;
      background: var(--gradient-2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
    }
    
    .project-card h3 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 0.5rem;
    }
    
    .project-card p {
      color: var(--gray);
      margin-bottom: 1.5rem;
      line-height: 1.7;
    }
    
    .tech-stack {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    
    .tech-badge {
      display: inline-block;
      background: var(--light);
      color: var(--primary);
      padding: 0.3rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: 'JetBrains Mono', monospace;
    }
    
    .project-links {
      display: flex;
      gap: 1rem;
    }
    
    .project-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }
    
    .project-link:hover {
      color: var(--primary-dark);
      gap: 0.6rem;
    }
    
    /* Skills Section */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }
    
    .skill-category {
      background: var(--light);
      border-radius: 12px;
      padding: 1.5rem;
    }
    
    .skill-category h3 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .skill-category h3 i {
      color: var(--primary);
    }
    
    .skill-list {
      list-style: none;
    }
    
    .skill-list li {
      padding: 0.5rem 0;
      color: var(--gray);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .skill-list li::before {
      content: '✓';
      color: var(--success);
      font-weight: bold;
    }
    
    /* Footer */
    footer {
      background: var(--dark);
      color: var(--gray-light);
      padding: 3rem 3rem 2rem;
      text-align: center;
    }
    
    .footer-content {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    
    .social-link {
      width: 45px;
      height: 45px;
      background: var(--dark-lighter);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.2rem;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    
    .social-link:hover {
      background: var(--primary);
      transform: translateY(-3px);
    }
    
    .footer-text {
      color: var(--gray);
      font-size: 0.9rem;
    }
    
    .footer-text a {
      color: var(--primary);
      text-decoration: none;
    }
    
    .footer-text a:hover {
      text-decoration: underline;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .container {
        box-shadow: none;
      }
      
      header {
        padding: 1rem 1.5rem;
      }
      
      .header-content {
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
      }
      
      nav {
        width: 100%;
        justify-content: flex-start;
        overflow-x: auto;
      }
      
      .hero {
        padding: 3rem 1.5rem;
      }
      
      .hero h1 {
        font-size: 2rem;
      }
      
      .hero p {
        font-size: 1rem;
      }
      
      .content-section {
        padding: 2rem 1.5rem;
      }
      
      .section-header h2 {
        font-size: 1.8rem;
      }
      
      .projects-grid {
        grid-template-columns: 1fr;
      }
      
      footer {
        padding: 2rem 1.5rem;
      }
    }
    
    /* Page-specific styles */
    main h1 {
      color: var(--dark);
      font-size: 2.5rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }
    
    main h2 {
      color: var(--dark);
      font-size: 2rem;
      margin: 2.5rem 0 1.5rem;
      font-weight: 700;
      border-bottom: 3px solid var(--primary);
      padding-bottom: 0.5rem;
      display: inline-block;
    }
    
    main h3 {
      color: var(--dark);
      font-size: 1.5rem;
      margin: 2rem 0 1rem;
      font-weight: 600;
    }
    
    main p {
      margin-bottom: 1rem;
      line-height: 1.8;
      color: var(--gray);
    }
    
    main ul, main ol {
      margin: 1rem 0 1rem 2rem;
    }
    
    main li {
      margin-bottom: 0.7rem;
      line-height: 1.7;
      color: var(--gray);
    }
    
    main a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    
    main a:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }
    
    blockquote {
      border-left: 4px solid var(--primary);
      padding: 1rem 1.5rem;
      margin: 1.5rem 0;
      background: var(--light);
      border-radius: 0 8px 8px 0;
      color: var(--gray);
    }
    
    blockquote strong {
      color: var(--dark);
    }
    
    hr {
      border: none;
      border-top: 2px solid var(--gray-light);
      margin: 2rem 0;
    }
    
    /* Utility classes */
    .text-center {
      text-align: center;
    }
    
    .mt-4 {
      margin-top: 2rem;
    }
    
    .mb-4 {
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-content">
        <div class="logo">
          <div class="logo-icon">YK</div>
          <h1>{{ site.name }}</h1>
        </div>
        <nav>
          <a href="{{ site.baseurl }}/">Home</a>
          <a href="{{ site.baseurl }}/showcase/">Projects</a>
          <a href="{{ site.baseurl }}/professionaldevelopment/">Skills</a>
          <a href="{{ site.baseurl }}/about.html">About</a>
          <a href="https://github.com/{{ site.github_username }}" target="_blank" class="btn-primary" style="padding: 0.5rem 1rem; background: var(--primary); color: white; border-radius: 8px;">
            <i class="fab fa-github"></i> GitHub
          </a>
        </nav>
      </div>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      <div class="footer-content">
        <div class="social-links">
          <a href="https://github.com/{{ site.github_username }}" target="_blank" class="social-link" title="GitHub">
            <i class="fab fa-github"></i>
          </a>
          <a href="{{ site.linkedin_url }}" target="_blank" class="social-link" title="LinkedIn">
            <i class="fab fa-linkedin-in"></i>
          </a>
          <a href="mailto:{{ site.email }}" class="social-link" title="Email">
            <i class="fas fa-envelope"></i>
          </a>
        </div>
        <div class="footer-text">
          <p>&copy; {{ "now" | date: "%Y" }} {{ site.name }}. Space Systems Engineering Portfolio.</p>
          <p><a href="https://github.com/{{ site.github_username }}/{{ site.repository | split: '/' | last }}" target="_blank">View Source on GitHub</a></p>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
